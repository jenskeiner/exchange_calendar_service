name: Publish RC Python distributions to TestPyPI

on:
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
      - 'support/**'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PACKAGE_NAME: exchange-calendar-service
  MODULE_NAME: exchange_calendar_service
  PYTHON_VERSION: "3.13"

jobs:
  build-and-publish:
    name: Build and publish release candidate Python distribution to TestPyPI.
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Required for trusted publishing.
      actions: read  # To determine RC number.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7
        with:
          enable-cache: false  # No cache when building RCs or releases.
      - name: Set up Python
        shell: bash
        run: uv python install ${PYTHON_VERSION}
      - name: Determine RC number.
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RC_NUMBER=$(gh run list --repo ${REPOSITORY} --workflow ${WORKFLOW} --branch ${REF_NAME} --json databaseId --jq "length")
          echo "RC number is $RC_NUMBER."
          echo "RC_NUMBER=$RC_NUMBER" >> $GITHUB_ENV
      - name: Determine package version.
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          export PACKAGE_VERSION=$(echo ${REF_NAME} | sed -e 's/^\(release\|hotfix\|support\)\///')rc${RC_NUMBER}
          echo "RC version is $PACKAGE_VERSION."
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
      - name: Build package
        run: uv build
